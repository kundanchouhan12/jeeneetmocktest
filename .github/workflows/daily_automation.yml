name: Daily Vault & Question Bank Automation

on:
  schedule:
    # Runs daily at 18:30 UTC (12:00 AM Midnight IST)
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-daily-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Firebase Service Account Key
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p scripts
          echo "$FIREBASE_CREDENTIALS_JSON" > scripts/serviceAccountKey.json

      - name: Execute Master Daily Automation Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/run_daily_automation.py

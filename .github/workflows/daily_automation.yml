name: Daily Vault & Question Bank Automation

on:
  schedule:
    # Runs daily at 18:30 UTC (12:00 AM Midnight IST)
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# Without this, a manual "Run workflow" click while the nightly cron run is still
# in progress starts a second run_daily_automation.py against the same Firestore
# project — two independent schedule_vault() calls with no mutual exclusion
# between them can transiently double up or thrash vault docs for the same date.
# `cancel-in-progress: false` queues the newer run behind the current one instead
# of killing a run mid Firestore-batch-write.
concurrency:
  group: daily-vault-automation
  cancel-in-progress: false

jobs:
  run-daily-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Firebase Service Account Key
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_CREDENTIALS_JSON" ]; then
            echo "ERROR: GitHub secret FIREBASE_SERVICE_ACCOUNT is missing or empty."
            exit 1
          fi
          python -c "import json,os; json.loads(os.environ['FIREBASE_CREDENTIALS_JSON']); print('Firebase service account JSON parsed OK')"
          mkdir -p scripts
          printf '%s\n' "$FIREBASE_CREDENTIALS_JSON" > scripts/serviceAccountKey.json
          test -s scripts/serviceAccountKey.json

      - name: Execute Master Daily Automation Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/run_daily_automation.py

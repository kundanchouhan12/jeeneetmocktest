plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
}

// Read secrets from local.properties (not checked into version control)
Properties localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

android {
    namespace 'com.jeeneet.mocktest'
    compileSdk 35

    defaultConfig {
        applicationId "com.jeeneet.mocktest"
        minSdk 24
        targetSdk 35
        versionCode 17
        versionName "1.1.0"
        buildConfigField "String", "GEMINI_API_KEY", "\"${localProps.getProperty('gemini.api.key', '')}\""
    }

    signingConfigs {
        release {
            storeFile file(localProps.getProperty('key.store.file', ''))
            storePassword localProps.getProperty('key.store.password', '')
            keyAlias localProps.getProperty('key.alias', '')
            keyPassword localProps.getProperty('key.alias.password', '')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.6'

    // Navigation Component
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.9'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.9'

    // ViewModel + LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'

    // Room Database
    implementation 'androidx.room:room-runtime:2.7.0'
    implementation 'androidx.room:room-ktx:2.7.0'
    kapt 'androidx.room:room-compiler:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.12.0')
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'

    // AdMob
    implementation 'com.google.android.gms:play-services-ads:24.2.0'

    // AdMob Mediation — Meta (Facebook) Audience Network
    implementation 'com.google.ads.mediation:facebook:6.17.0.0'

    // AdMob Mediation — Unity Ads
    implementation 'com.google.ads.mediation:unity:4.15.0.0'

    // Google Play Billing (IAP)
    implementation 'com.android.billingclient:billing-ktx:7.1.1'

    // Google Play In-App Updates
    implementation 'com.google.android.play:app-update-ktx:2.1.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.11.0'

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // MPAndroidChart
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Konfetti animation
    implementation 'nl.dionsegijn:konfetti-xml:2.0.4'

    // CameraX
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'

    // ML Kit Vision
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JLatexMath — renders LaTeX/math as image spans in TextViews (used directly via JLatexMathDrawable)
    implementation 'io.noties.markwon:ext-latex:4.6.2'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.10.0'

    // Lottie animations
    implementation 'com.airbnb.android:lottie:6.4.0'

    // Unit Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    testImplementation 'io.mockk:mockk:1.13.8'
}
